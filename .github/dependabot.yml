version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
      production-dependencies: { dependency-type: production }
    ignore:
      # Matches the Node major in .node-version
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint and svelte-check do not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message: { prefix: 'build(deps)' }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      rust-dependencies: { patterns: ['*'] }
    commit-message: { prefix: 'build(deps)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
    commit-message: { prefix: 'ci(deps)' }
