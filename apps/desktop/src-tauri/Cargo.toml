[package]
name = "mdx-desktop"
version = "0.8.1"
description = "MDX - Markdown Explorer"
authors = ["getaxtools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getaxtools/mdx"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "mdx_desktop"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dunce = "1.0.5"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
thiserror = "2.0.21"
notify = "8.2.0"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
# Free space on the target drive before a Notes folder is moved; a safe wrapper over the OS call.
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin for the old copy of a moved Notes folder; pinned below 5.3.0, which is under two weeks old.
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
