[package]
name = "mdx-desktop"
version = "0.8.1"
description = "MDX - Markdown Explorer"
authors = ["getaxtools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getaxtools/mdx"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "mdx_desktop"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dunce = "1.0.5"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
thiserror = "2.0.21"
notify = "8.2.0"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
# Free space on the target drive before a Notes folder is moved; a safe wrapper over the OS call.
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
# Protected notes: Argon2id for the password, XChaCha20-Poly1305 for every file, keys wiped on drop.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# The operating system's random generator, already in the tree; every key, salt and nonce comes from it.
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["derive", "serde"] }

[target.'cfg(windows)'.dependencies]
# The Windows calls that need unsafe code (Recycle Bin, volume names, registry), kept out of this crate.
mdx-native-windows = { version = "0.8.1", path = "../native-windows" }
# Remember protected notes on this PC: a device key in Credential Manager, kept local to the PC.
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3.27.0"

# Argon2id at full speed in tests and debug builds too, so unlocking and calibration are measured as
# they will run.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
