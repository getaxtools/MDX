[package]
name = "mdx-desktop"
version = "0.6.3"
description = "MDX - Markdown Explorer"
authors = ["getaxtools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getaxtools/mdx"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "mdx_desktop"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dunce = "1.0.5"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
thiserror = "2.0.21"
notify = "8.2.0"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
